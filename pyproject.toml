[project]
name = "anthology-rag"
version = "0.1.0"
description = "RAG chatbot for exploring the ACL Anthology"
readme = "README.md"
authors = [
    { name = "Simeon Junker", email = "simeon.junker@uni-bielefeld.de" }
]
requires-python = ">=3.12"
dependencies = [
    "acl-anthology>=1.3.4",
    "gitpython>=3.1",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "tqdm>=4.66",
]

[project.scripts]
build-db = "anthology_rag.db.cli:main"
chat = "anthology_rag.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
